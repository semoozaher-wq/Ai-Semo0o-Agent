<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Semo0o">
  <defs>
    <linearGradient id="semoStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#6C5CE7"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="semoNodeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="semoNodeB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="semoGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circuit traces (PCB / neural motif) -->
  <g stroke="url(#semoStroke)" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M330 168 L392 168 L420 140"/>
    <path d="M178 302 L120 302 L92 330"/>
  </g>
  <g fill="url(#semoStroke)" opacity="0.75">
    <circle cx="420" cy="140" r="9"/>
    <circle cx="92" cy="330" r="9"/>
  </g>

  <!-- Core S ribbon -->
  <path d="M330 168
           C 330 132, 296 112, 256 112
           C 210 112, 178 136, 178 172
           C 178 206, 214 220, 256 230
           C 298 240, 334 254, 334 292
           C 334 330, 300 356, 256 356
           C 210 356, 180 336, 178 302"
        fill="none" stroke="url(#semoStroke)" stroke-width="48"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#semoGlow)"/>

  <!-- Terminal nodes -->
  <circle cx="330" cy="168" r="30" fill="url(#semoNodeA)"/>
  <circle cx="330" cy="168" r="12" fill="#0B1230"/>
  <circle cx="178" cy="302" r="30" fill="url(#semoNodeB)"/>
  <circle cx="178" cy="302" r="12" fill="#0B1230"/>
</svg>
