name: Quality

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Secret and SAST scan
        run: npm run security:scan
      - name: Dependency audit
        continue-on-error: true
        run: npm run audit:production
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Expo doctor
        run: npm run doctor
      - name: Web export
        run: npm run build
      - name: Browser integration smoke test
        run: npm run test:browser-smoke 
