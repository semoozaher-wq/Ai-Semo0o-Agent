name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        # Test BOTH the declared minimum (`engines.node >= 22.5.0`, the first
        # release with `node:sqlite`) AND the exact production runtime pinned in
        # backend/Dockerfile and render.yaml (22.11.0). This keeps the release
        # gate honest: a regression on either the floor or the deployed version
        # fails CI instead of shipping.
        node-version: ['22.5', '22.11.0']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # `pdf.extract` shells out to poppler's `pdftotext`; install it so the
      # pdf.extract regression test runs for real (it self-skips when absent).
      - name: Install poppler-utils (pdftotext for the pdf.extract tool test)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Run project tests
        run: npm test

      # Dependency-audit release gate. It is NOT ignored: it fails the build on
      # any advisory, newly-affected package or severity escalation outside the
      # reviewed baseline (scripts/audit-baseline.json). The previous
      # `continue-on-error: true` (which silently swallowed a real audit failure)
      # has been removed.
      - name: Dependency audit gate (fails on new advisories)
        run: npm run audit:gate
