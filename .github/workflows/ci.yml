name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        # Test BOTH the declared minimum (`engines.node >= 22.13.0`, the lowest
        # Node 22 release that satisfies the React Native / Metro toolchain
        # requirement `^20.19.4 || ^22.13.0 || ^24.3.0 || >= 25.0.0`) AND the
        # exact production runtime pinned in backend/Dockerfile and render.yaml
        # (22.23.2). This keeps the release gate honest: a regression on either
        # the floor or the deployed version fails CI instead of shipping.
        node-version: ['22.13.0', '22.23.2']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # `pdf.extract` shells out to poppler's `pdftotext`; install it so the
      # pdf.extract regression test runs for real (it self-skips when absent).
      - name: Install poppler-utils (pdftotext for the pdf.extract tool test)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # CRITICAL CI RULE: a real Chromium-based binary MUST be present AND
      # resolvable BEFORE the browser steps run. `resolveBrowserBinary()` in
      # backend/browser/launcher.mjs consults only CHROME_BIN / CHROMIUM_BIN /
      # BROWSER_BIN and a fixed PATH list -- it does NOT scan the Playwright
      # cache -- so this step resolves the concrete path and exports it to
      # $GITHUB_ENV. It prefers a REAL (non-snap) Chrome/Chromium because a snap
      # stub cannot use a private --user-data-dir and its sandbox helper is not
      # root-owned; it then falls back to Playwright Chromium (with OS deps), and
      # hard-fails if none can be resolved.
      - name: Install and Locate Chromium Browser
        run: |
          set -euo pipefail
          for bin in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$bin" >/dev/null 2>&1; then
              CANDIDATE="$(command -v "$bin")"
              REAL="$(readlink -f "$CANDIDATE" 2>/dev/null || echo "$CANDIDATE")"
              case "$CANDIDATE$REAL" in
                */snap/*) echo "Skipping snap wrapper: $CANDIDATE -> $REAL"; continue ;;
              esac
              BIN="$CANDIDATE"
              break
            fi
          done
          if [ -z "${BIN:-}" ]; then
            echo "Installing Chromium via Playwright..."
            npx --yes playwright install --with-deps chromium
            BIN="$(find "${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}" -maxdepth 3 -type f -name chrome -path '*chrome-linux*' 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "${BIN:-}" ] || [ ! -x "$BIN" ]; then
            echo "::error::Failed to locate a valid Chromium executable."
            exit 1
          fi
          echo "Found Chromium binary at: $BIN"
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
          echo "CHROMIUM_BIN=$BIN" >> "$GITHUB_ENV"

      # Ubuntu 23.10+/24.04 restricts unprivileged user namespaces via AppArmor,
      # so Chromium's NAMESPACE sandbox aborts with "No usable sandbox!". We first
      # TRY to enable Chromium's REAL SUID sandbox (which keeps the sandbox ON) --
      # but this is BEST-EFFORT and must NEVER fail the build: GitHub-hosted
      # runners are ephemeral, network-isolated VMs, and a snap/Playwright build
      # whose helper cannot be made setuid would otherwise hard-fail here.
      #
      # We therefore ALWAYS export BROWSER_NO_SANDBOX=true to $GITHUB_ENV, which
      # is the documented, opt-in escape hatch in backend/browser/launcher.mjs
      # (it adds --no-sandbox ONLY when this variable is exactly "true"). This
      # GUARANTEES the browser smoke + E2E steps can start on any runner while
      # leaving the product's default (sandboxed) behaviour untouched.
      #
      # The resolved CHROME_BIN/CHROMIUM_BIN are passed INLINE through `sudo`
      # because `sudo` resets the environment (env_reset) and would otherwise
      # strip the values exported to $GITHUB_ENV -- which, for a Playwright-only
      # install (no `google-chrome` on PATH), makes the script report "no browser
      # found".
      - name: Configure Chromium sandbox for CI (best-effort SUID, --no-sandbox fallback)
        run: |
          set -uo pipefail
          if sudo BROWSER_SANDBOX_REQUIRED=false CHROME_BIN="$CHROME_BIN" CHROMIUM_BIN="$CHROMIUM_BIN" \
               node scripts/enable-browser-sandbox.mjs; then
            echo "Chromium SUID sandbox enabled (real sandbox preserved)."
          else
            echo "::warning::Could not enable the Chromium SUID sandbox on this runner; using --no-sandbox for the CI browser steps."
          fi
          # Guarantee the browser steps can start (see the comment above).
          echo "BROWSER_NO_SANDBOX=true" >> "$GITHUB_ENV"

      - name: Run project tests
        run: npm test

      # Dependency-audit release gate. It is NOT ignored: it fails the build on
      # any advisory, newly-affected package or severity escalation outside the
      # reviewed baseline (scripts/audit-baseline.json). The previous
      # `continue-on-error: true` (which silently swallowed a real audit failure)
      # has been removed.
      - name: Dependency audit gate (fails on new advisories)
        run: npm run audit:gate
