name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [22.5]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # `pdf.extract` shells out to poppler's `pdftotext`; install it so the
      # pdf.extract regression test runs for real (it self-skips when absent).
      - name: Install poppler-utils (pdftotext for the pdf.extract tool test)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Run project tests
        run: npm test

      - name: Security audit
        run: npm run audit:production
        continue-on-error: true
