# =============================================================================
# render.yaml — Blueprint for the Ai-Semo0o-Agent BACKEND on Render.
# =============================================================================

services:
  - type: web
    name: ai-semo0o-backend
    runtime: node
    plan: free
    region: frankfurt

    # Reproducible install from package-lock.json
    buildCommand: npm ci

    # Canonical backend start command
    startCommand: node --experimental-sqlite backend/server.mjs

    healthCheckPath: /health
    # Gated CD: production deploys are triggered by .github/workflows/deploy.yml
    # ONLY after BOTH the "CI" and "Quality" workflows are green for the same
    # commit on master (via the RENDER_DEPLOY_HOOK secret). Push-based auto-deploy
    # is therefore disabled so a red build can never reach production.
    #
    # Prefer the dashboard alternative? Set "Auto-Deploy: After CI Checks Pass" on
    # the service and flip this back to `true`; Render then waits for the GitHub
    # check suite (which includes CI + Quality) before deploying.
    autoDeploy: false

    envVars:
      - key: NODE_VERSION
        value: 22.23.2

      - key: NODE_ENV
        value: production

      # Structured production logs
      - key: LOG_FORMAT
        value: json

      - key: BIND_HOST
        value: 0.0.0.0

      # Render injects PORT automatically.
      - key: DISABLE_WORKER
        value: "0"

      # -----------------------------------------------------------------------
      # STORAGE
      # -----------------------------------------------------------------------
      # On Render Free there is no persistent disk.
      # The application automatically falls back to:
      #   backend/data/agent.sqlite
      #   backend/data/workspace
      #
      # Do NOT set DATABASE_FILE or WORKSPACE_ROOT to /var/data on Free.
      #
      # For a paid Render plan with Persistent Disk, configure:
      #
      # - key: DATABASE_FILE
      #   value: /var/data/db/agent.sqlite
      #
      # - key: WORKSPACE_ROOT
      #   value: /var/data/workspace

      # -----------------------------------------------------------------------
      # SECRETS
      # -----------------------------------------------------------------------
      # Add real secrets from the Render Dashboard.
      # NEVER commit their values to GitHub.
      #
      # - key: SECRETS_MASTER_KEY
      # - key: ALLOWED_ORIGIN
      # - key: PUBLIC_APP_URL

      # -----------------------------------------------------------------------
      # PRIVATE-APP ACCESS GATE  (REQUIRED for a private deployment)
      # -----------------------------------------------------------------------
      # Possessing the URL must NEVER be enough to open the app. Set
      # APP_ACCESS_KEY (a long random string) in the Render Dashboard; only
      # people who hold it can create an account. Without it, sign-up stays
      # closed and every authenticated route is unreachable to outsiders.
      #
      # - key: APP_ACCESS_KEY
      #   sync: false
      #
      # Keep open sign-up disabled (this is also the production default).
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "false"
      #
      # Optionally withhold the session until the email address is verified.
      # - key: REQUIRE_EMAIL_VERIFICATION
      #   value: "true"
      #
      # FIRST ACCOUNT (bootstrap) — pick ONE of these two options:
      #
      # Option A (recommended, no Shell needed): set BOTH of these in the Render
      # Dashboard. On the next boot, if — and only if — the database has NO
      # accounts yet, the first owner is created automatically and marked
      # verified. It is a strict no-op once any account exists, so leaving them
      # set is harmless. Remove them after the first successful boot.
      #
      # - key: BOOTSTRAP_ADMIN_EMAIL
      #   sync: false
      # - key: BOOTSTRAP_ADMIN_PASSWORD   # >= 12 chars
      #   sync: false
      #
      # Option B (Render Shell): with sign-up closed and no APP_ACCESS_KEY there
      # is no HTTP way in (by design). Create the first owner from the Shell:
      #   ADMIN_EMAIL=you@example.com ADMIN_PASSWORD='a-long-passphrase' \
      #     npm run create:admin

      # -----------------------------------------------------------------------
      # LLM PROVIDERS
      # -----------------------------------------------------------------------
      # Configure at least one provider in Render Dashboard.
      #
      # - key: OPENAI_API_KEY
      # - key: OPENAI_API_BASE
      # - key: OPENAI_MODEL
      #
      # - key: GEMINI_API_KEY
      # - key: GEMINI_MODEL
      #
      # - key: ANTHROPIC_API_KEY
      # - key: ANTHROPIC_MODEL

    # -------------------------------------------------------------------------
    # OPTIONAL PERSISTENT DISK
    # -------------------------------------------------------------------------
    # Only for PAID Render plans.
    #
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
