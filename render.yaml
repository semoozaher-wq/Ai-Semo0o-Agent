# Render blueprint for the Ai-Semo0o-Agent BACKEND.
# Vercel cannot run this backend (it is a long-running Node server that needs
# node:sqlite + a writable disk + a background worker). Render/Railway/Fly.io
# can. Deploy this file from the repo root on Render.
services:
  - type: web
    name: ai-semo0o-backend
    runtime: node
    plan: starter            # a paid plan is required for a persistent disk
    buildCommand: npm install
    startCommand: node --experimental-sqlite backend/server.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: BIND_HOST
        value: 0.0.0.0
      - key: DISABLE_WORKER
        value: "0"
      - key: DATABASE_FILE
        value: /var/data/agent.sqlite
      - key: WORKSPACE_ROOT
        value: /var/data/workspace
      # Set these in the Render dashboard (do NOT commit real secrets):
      # - key: ALLOWED_ORIGIN            # e.g. https://your-app.vercel.app
      # - key: PUBLIC_APP_URL
      # - key: OPENAI_API_KEY / ANTHROPIC_API_KEY / GEMINI_API_KEY ...
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
