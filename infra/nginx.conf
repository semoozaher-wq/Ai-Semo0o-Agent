# Deploy behind a real TLS certificate. Do not expose Node directly to the public internet.
limit_req_zone $binary_remote_addr zone=agent_api:10m rate=10r/s;
upstream agent_backend { server 127.0.0.1:8787; }
server {
  listen 80;
  server_name agent.example.com;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name agent.example.com;
  ssl_certificate /etc/letsencrypt/live/agent.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/agent.example.com/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  location / {
    limit_req zone=agent_api burst=30 nodelay;
    proxy_pass http://agent_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }
}
